<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Portal institucional de LUVEGI INGENIEROS S.A.C."
  >

  <meta name="theme-color" content="#001426">

  <!-- Configuración para instalación como aplicación -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Configuración para iPhone y iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="Portal LUVEGI"
  >
  <link
    rel="apple-touch-icon"
    href="icons/Icon-192.png"
  >

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <title>Portal LUVEGI</title>

  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #001426;
    }

    #luvegi-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background:
        radial-gradient(circle at 50% 30%, rgba(0, 95, 163, 0.35), transparent 60%),
        linear-gradient(160deg, #001426 0%, #003366 100%);
      transition: opacity 0.4s ease;
    }

    #luvegi-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #luvegi-splash .logo {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    #luvegi-splash .logo span {
      color: #FF0000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 40px;
      font-weight: 800;
    }

    #luvegi-splash .titulo {
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    #luvegi-splash .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #FF0000;
      border-radius: 50%;
      animation: luvegi-giro 0.9s linear infinite;
    }

    @keyframes luvegi-giro {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="luvegi-splash">
    <div class="logo"><span>L</span></div>
    <div class="titulo">Portal LUVEGI</div>
    <div class="spinner" role="status" aria-label="Cargando Portal LUVEGI"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('luvegi-splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 500);
      }
    });
  </script>

  <script src="flutter_bootstrap.js?v=20261105085059" async></script>
</body>
</html>
